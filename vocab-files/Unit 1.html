<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tawjihi English — Unit 1 Vocabulary (Exact Book Questions) v2</title>
<style>
  :root{
    --primary:#0d9488; --primary-dark:#0f766e; --navy:#0f172a;
    --bg:#f1f5f9; --card:#ffffff; --muted:#64748b;
    --good:#16a34a; --bad:#dc2626; --warn:#d97706; --danger:#b91c1c;
    --border:#e2e8f0;
    --sec-A:#0d9488; --sec-B:#2563eb; --sec-C:#9333ea;
    --sec-D:#d97706; --sec-E:#db2777; --sec-F:#16a34a;
    --sec-G:#0891b2; --sec-H:#ea580c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--navy);line-height:1.5;min-height:100vh}
  header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;
         position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:17px;font-weight:600}
  header .home-btn{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:8px;
                   cursor:pointer;font-weight:500;font-size:14px}
  header .home-btn:hover{background:var(--primary-dark)}
  main{max-width:880px;margin:0 auto;padding:24px 16px}
  .card{background:var(--card);border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(15,23,42,.06);
        margin-bottom:18px;border:1px solid var(--border)}
  h2{margin-top:0;color:var(--navy);font-size:22px}
  h3{color:var(--navy);font-size:17px;margin:0 0 12px 0}
  .intro{color:var(--muted);font-size:15px}
  .mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
  .mode-btn{background:#fff;border:2px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;
            text-align:left;transition:.2s;font-family:inherit}
  .mode-btn:hover:not(:disabled){border-color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 16px rgba(13,148,136,.15)}
  .mode-btn:disabled{opacity:.5;cursor:not-allowed}
  .mode-btn .icon{font-size:28px;margin-bottom:6px;display:block}
  .mode-btn .title{font-weight:600;font-size:16px;color:var(--navy);display:block;margin-bottom:4px}
  .mode-btn .desc{font-size:13px;color:var(--muted)}
  .progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:14px}
  .progress-fill{height:100%;background:var(--primary);transition:width .3s}
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:8px;color:#fff}
  .badge.A{background:var(--sec-A)} .badge.B{background:var(--sec-B)} .badge.C{background:var(--sec-C)}
  .badge.D{background:var(--sec-D)} .badge.E{background:var(--sec-E)} .badge.F{background:var(--sec-F)}
  .badge.G{background:var(--sec-G)} .badge.H{background:var(--sec-H)}
  .question-text{font-size:17px;font-weight:500;margin:8px 0 18px 0;color:var(--navy)}
  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
  .option{background:#fff;border:2px solid var(--border);border-radius:10px;padding:13px 16px;
          cursor:pointer;text-align:left;font-family:inherit;font-size:15px;transition:.15s;display:flex;align-items:center;gap:12px}
  .option:hover:not(.locked){border-color:var(--primary);background:#f0fdfa}
  .option.selected{border-color:var(--primary);background:#ccfbf1}
  .option.correct{border-color:var(--good);background:#dcfce7;color:#14532d}
  .option.wrong{border-color:var(--bad);background:#fee2e2;color:#7f1d1d}
  .option .letter{background:var(--navy);color:#fff;width:28px;height:28px;border-radius:50%;
                  display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;font-size:13px}
  .option.correct .letter{background:var(--good)}
  .option.wrong .letter{background:var(--bad)}
  .confidence{background:#f8fafc;border-radius:10px;padding:14px;margin-bottom:14px;border:1px solid var(--border)}
  .confidence-label{font-weight:600;font-size:14px;margin-bottom:8px;color:var(--navy)}
  .confidence-options{display:flex;gap:10px;flex-wrap:wrap}
  .conf-opt{background:#fff;border:2px solid var(--border);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px;transition:.15s}
  .conf-opt.selected{border-color:var(--primary);background:#ccfbf1;font-weight:600}
  .btn{background:var(--primary);color:#fff;border:none;padding:11px 20px;border-radius:10px;
       cursor:pointer;font-weight:600;font-size:15px;font-family:inherit;transition:.2s}
  .btn:hover:not(:disabled){background:var(--primary-dark)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.secondary{background:#fff;color:var(--navy);border:2px solid var(--border)}
  .btn.secondary:hover{border-color:var(--primary)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .explanation{background:#f0fdfa;border-left:4px solid var(--primary);padding:13px 16px;
               border-radius:6px;margin-top:14px;font-size:14px;line-height:1.6}
  .explanation strong{color:var(--primary-dark)}
  .ref{font-size:12px;color:var(--muted);margin-top:8px;display:block;font-weight:500}
  .results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0}
  .stat{background:#f8fafc;padding:14px;border-radius:10px;text-align:center;border:1px solid var(--border)}
  .stat .value{font-size:26px;font-weight:700;color:var(--navy)}
  .stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .stat.good .value{color:var(--good)}
  .stat.bad .value{color:var(--bad)}
  .stat.warn .value{color:var(--warn)}
  .stat.danger .value{color:var(--danger)}
  .readiness{padding:18px;border-radius:10px;text-align:center;font-weight:600;font-size:17px;margin:14px 0}
  .readiness.r1{background:#fee2e2;color:var(--bad)}
  .readiness.r2{background:#ffedd5;color:#9a3412}
  .readiness.r3{background:#fef9c3;color:#854d0e}
  .readiness.r4{background:#dcfce7;color:#14532d}
  .readiness.r5{background:#ccfbf1;color:var(--primary-dark)}
  .mistake-item{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}

  /* Study mode */
  .study-section{margin-bottom:22px}
  .study-header{position:sticky;top:60px;background:#fff;padding:12px 16px;border-radius:10px;
                border-left:6px solid var(--primary);box-shadow:0 2px 6px rgba(0,0,0,.06);
                margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;z-index:5}
  .study-header.A{border-left-color:var(--sec-A)}
  .study-header.B{border-left-color:var(--sec-B)}
  .study-header.C{border-left-color:var(--sec-C)}
  .study-header.D{border-left-color:var(--sec-D)}
  .study-header.E{border-left-color:var(--sec-E)}
  .study-header.F{border-left-color:var(--sec-F)}
  .study-header.G{border-left-color:var(--sec-G)}
  .study-header.H{border-left-color:var(--sec-H)}
  .study-header h3{margin:0;font-size:16px}
  .study-header .src{font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
  .study-q{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px}
  .study-q .qnum{font-weight:600;color:var(--muted);font-size:13px;margin-bottom:6px}
  .study-q .qtext{font-size:15px;margin-bottom:10px;color:var(--navy)}
  .study-opt{padding:8px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:14px;display:flex;align-items:center;gap:10px}
  .study-opt.correct{background:#dcfce7;border-color:var(--good);color:#14532d;font-weight:500}
  .study-opt .letter-sm{background:#e2e8f0;color:var(--navy);width:22px;height:22px;border-radius:50%;
                        display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;flex-shrink:0}
  .study-opt.correct .letter-sm{background:var(--good);color:#fff}
  .study-exp{background:#f0fdfa;border-left:3px solid var(--primary);padding:10px 14px;
             border-radius:4px;font-size:13px;margin-top:10px;line-height:1.5}
  .section-pick{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}
  @media print{
    header,.home-btn,#print-btn,.btn{display:none !important}
    body{background:#fff}
    .study-header{position:static;box-shadow:none;border:1px solid #ccc}
    .study-q{break-inside:avoid;page-break-inside:avoid}
  }
  @media(max-width:600px){
    .question-text{font-size:16px}
    header h1{font-size:14px}
    main{padding:16px 10px}
    .card{padding:16px}
  }
</style>
</head>
<body>
<header>
  <h1>📘 Tawjihi English — Unit 1 Vocabulary (v2)</h1>
  <button class="home-btn" onclick="goHome()">🏠 Home</button>
</header>
<main id="app"></main>

<script>
const SECTIONS = {
  A: {title:"Section A — Complete with Phrasal Verbs",
      source:"📖 Student's Book p.7 · Lesson 2A · Exercise 5",
      instruction:"Complete each sentence with the correct phrasal verb (in the correct form).",
      color:"A"},
  B: {title:"Section B — Match Phrasal Verbs with Definitions",
      source:"📖 Student's Book p.7 · Lesson 2A · Exercise 4",
      instruction:"Choose the phrasal verb that matches each definition.",
      color:"B"},
  C: {title:"Section C — Match Idioms with Definitions",
      source:"📖 Student's Book p.8 · Lesson 3A · Exercise 4",
      instruction:"Choose the correct definition for each idiom.",
      color:"C"},
  D: {title:"Section D — Choose the Correct Word to Complete the Idiom",
      source:"📓 Workbook p.6 · Lesson 2B · Exercise 2",
      instruction:"Choose the correct word to complete each idiom.",
      color:"D"},
  E: {title:"Section E — Match Situations with Idioms",
      source:"📓 Workbook p.6 · Lesson 2B · Exercise 3",
      instruction:"Match each situation with the correct idiom.",
      color:"E"},
  F: {title:"Section F — Complete the Conversation (Idioms & Phrases)",
      source:"📓 Workbook p.6 · Lesson 2B · Exercise 4",
      instruction:"Complete each gap in the conversation with the correct word from the box.",
      color:"F"},
  G: {title:"Section G — Match Strong Adjectives with their Synonyms ⭐ NEW",
      source:"📖 Student's Book p.10 · Lesson 5A · Exercise 2",
      instruction:"Match each strong emotion adjective with its basic synonym.",
      color:"G"},
  H: {title:"Section H — Complete Sentences with Emotion Adjectives ⭐ NEW",
      source:"📖 Student's Book p.10 · Lesson 5A · Exercise 3",
      instruction:"Complete each sentence with the correct strong emotion adjective.",
      color:"H"}
};

const QUESTIONS = [
  /* SECTION A */
  {sec:"A",num:1,q:"I was embarrassed when he _____ that I had made some basic spelling mistakes.",
   opts:["pointed out","picked up","took in","wiped out"],correct:0,
   exp:"<strong>pointed out</strong> = drew attention to a fact.",ref:"SB p.7 · L2A Ex 5 #1"},
  {sec:"A",num:2,q:"It was cloudy, but he could still _____ the distant star.",
   opts:["bring about","make out","get across","spell out"],correct:1,
   exp:"<strong>make out</strong> = see something with difficulty.",ref:"SB p.7 · L2A Ex 5 #2"},
  {sec:"A",num:3,q:"I _____ an interesting article about space exploration the other day.",
   opts:["wiped out","figured out","came across","took in"],correct:2,
   exp:"<strong>came across</strong> = found by chance.",ref:"SB p.7 · L2A Ex 5 #3"},
  {sec:"A",num:4,q:"Technology has _____ many changes in the way we live.",
   opts:["brought about","picked up","made out","spelt out"],correct:0,
   exp:"<strong>brought about</strong> = caused to happen.",ref:"SB p.7 · L2A Ex 5 #4"},
  {sec:"A",num:5,q:"My science teacher is very good at _____ difficult ideas so that we always understand them.",
   opts:["wiping out","getting across","coming across","taking in"],correct:1,
   exp:"<strong>getting across</strong> = successfully communicating an idea.",ref:"SB p.7 · L2A Ex 5 #5"},
  {sec:"A",num:6,q:"It took me ages to _____ exactly how to use the telescope.",
   opts:["bring about","point out","figure out","take in"],correct:2,
   exp:"<strong>figure out</strong> = solve or understand by thinking.",ref:"SB p.7 · L2A Ex 5 #6"},
  {sec:"A",num:7,q:"You don't understand? Do I have to _____ what I mean?",
   opts:["spell out","come across","wipe out","pick up"],correct:0,
   exp:"<strong>spell out</strong> = explain very clearly and in detail.",ref:"SB p.7 · L2A Ex 5 #7"},
  {sec:"A",num:8,q:"We couldn't use our mobile phones in the desert, but started to _____ signals when we went into the mountains.",
   opts:["take in","make out","figure out","pick up"],correct:3,
   exp:"<strong>pick up</strong> = receive (signals/sounds).",ref:"SB p.7 · L2A Ex 5 #8"},

  /* SECTION B */
  {sec:"B",num:1,q:"Which phrasal verb means: \"to receive sounds, phone signals, etc.\"?",
   opts:["pick up","point out","take in","get across"],correct:0,
   exp:"<strong>pick up</strong> = receive (sounds, signals).",ref:"SB p.7 · L2A Ex 4 #1"},
  {sec:"B",num:2,q:"Which phrasal verb means: \"to cause something to happen\"?",
   opts:["come across","bring about","make out","spell out"],correct:1,
   exp:"<strong>bring about</strong> = cause to happen.",ref:"SB p.7 · L2A Ex 4 #2"},
  {sec:"B",num:3,q:"Which phrasal verb means: \"to tell someone something you think they don't know\"?",
   opts:["figure out","wipe out","point out","take in"],correct:2,
   exp:"<strong>point out</strong> = draw attention to a fact.",ref:"SB p.7 · L2A Ex 4 #3"},
  {sec:"B",num:4,q:"Which phrasal verb means: \"to see something with difficulty\"?",
   opts:["make out","bring about","spell out","pick up"],correct:0,
   exp:"<strong>make out</strong> = see/perceive with difficulty.",ref:"SB p.7 · L2A Ex 4 #4"},
  {sec:"B",num:5,q:"Which phrasal verb means: \"to destroy something completely\"?",
   opts:["spell out","take in","get across","wipe out"],correct:3,
   exp:"<strong>wipe out</strong> = destroy completely.",ref:"SB p.7 · L2A Ex 4 #5"},
  {sec:"B",num:6,q:"Which phrasal verb means: \"to successfully communicate a message or an idea\"?",
   opts:["come across","get across","make out","figure out"],correct:1,
   exp:"<strong>get across</strong> = make an idea understood.",ref:"SB p.7 · L2A Ex 4 #6"},
  {sec:"B",num:7,q:"Which phrasal verb means: \"to explain something very clearly\"?",
   opts:["pick up","wipe out","spell out","bring about"],correct:2,
   exp:"<strong>spell out</strong> = explain very clearly.",ref:"SB p.7 · L2A Ex 4 #7"},
  {sec:"B",num:8,q:"Which phrasal verb means: \"to meet or find something or someone\"?",
   opts:["come across","point out","take in","wipe out"],correct:0,
   exp:"<strong>come across</strong> = meet or find by chance.",ref:"SB p.7 · L2A Ex 4 #8"},
  {sec:"B",num:9,q:"Which phrasal verb means: \"to solve or understand something\"?",
   opts:["spell out","make out","figure out","bring about"],correct:2,
   exp:"<strong>figure out</strong> = solve or work out the answer.",ref:"SB p.7 · L2A Ex 4 #9"},
  {sec:"B",num:10,q:"Which phrasal verb means: \"to understand and remember something you are told\"?",
   opts:["take in","pick up","point out","get across"],correct:0,
   exp:"<strong>take in</strong> = absorb / understand information.",ref:"SB p.7 · L2A Ex 4 #10"},

  /* SECTION C */
  {sec:"C",num:1,q:"What does \"jump down somebody's throat\" mean?",
   opts:["to be unable to say anything because someone else is talking all the time",
         "to embarrass someone by forcing them to answer a difficult question",
         "to have to make the final point","to react angrily to something",
         "to ask someone a lot of questions quickly","to not stop talking about something"],
   correct:3,exp:"<strong>jump down somebody's throat</strong> = react angrily.",ref:"SB p.8 · L3A Ex 4 #1"},
  {sec:"C",num:2,q:"What does \"put somebody on the spot\" mean?",
   opts:["to embarrass someone by forcing them to answer a difficult question",
         "to react angrily to something","to not stop talking about something",
         "to be unable to say anything because someone else is talking all the time"],
   correct:0,exp:"<strong>put somebody on the spot</strong> = embarrass by demanding a difficult answer.",ref:"SB p.8 · L3A Ex 4 #2"},
  {sec:"C",num:3,q:"What does \"fire questions at someone\" mean?",
   opts:["to have to make the final point","to ask someone a lot of questions quickly",
         "to react angrily to something",
         "to be unable to say anything because someone else is talking all the time"],
   correct:1,exp:"<strong>fire questions at someone</strong> = ask many questions quickly.",ref:"SB p.8 · L3A Ex 4 #3"},
  {sec:"C",num:4,q:"What does \"refuse to let something drop\" mean?",
   opts:["to embarrass someone","to not stop talking about something",
         "to ask many questions","to have the final point"],
   correct:1,exp:"<strong>refuse to let it drop</strong> = won't stop discussing it.",ref:"SB p.8 · L3A Ex 4 #4"},
  {sec:"C",num:5,q:"What does \"insist on having the last word\" mean?",
   opts:["to have to make the final point","to be unable to say anything",
         "to react angrily","to ask many questions"],
   correct:0,exp:"<strong>insist on having the last word</strong> = always need to finish the argument.",ref:"SB p.8 · L3A Ex 4 #5"},
  {sec:"C",num:6,q:"What does \"not get a word in edgeways\" mean?",
   opts:["to not stop talking about something","to ask many questions",
         "to be unable to say anything because someone else is talking all the time",
         "to embarrass someone"],
   correct:2,exp:"<strong>not get a word in edgeways</strong> = can't say anything because the other person dominates.",ref:"SB p.8 · L3A Ex 4 #6"},

  /* SECTION D */
  {sec:"D",num:1,q:"He continued to _____ questions at someone.",
   opts:["throw","fire","shoot","ask"],correct:1,
   exp:"The fixed idiom is <strong>fire questions at someone</strong>.",ref:"WB p.6 · L2B Ex 2 #1"},
  {sec:"D",num:2,q:"You insist on having the last _____.",
   opts:["say","word","talk","point"],correct:1,
   exp:"The fixed idiom is <strong>have the last word</strong>.",ref:"WB p.6 · L2B Ex 2 #2"},
  {sec:"D",num:3,q:"I didn't like being put _____ the spot.",
   opts:["on","in","at","under"],correct:0,
   exp:"The correct preposition is <strong>on</strong> — put somebody <em>on</em> the spot.",ref:"WB p.6 · L2B Ex 2 #3"},
  {sec:"D",num:4,q:"She didn't have to jump down my _____.",
   opts:["neck","throat","back","face"],correct:1,
   exp:"The idiom is <strong>jump down somebody's throat</strong>.",ref:"WB p.6 · L2B Ex 2 #4"},
  {sec:"D",num:5,q:"I couldn't get a word in _____.",
   opts:["edgeways","sideways","crossways","inwards"],correct:0,
   exp:"The fixed idiom is <strong>get a word in edgeways</strong>.",ref:"WB p.6 · L2B Ex 2 #5"},
  {sec:"D",num:6,q:"He refused to let it _____.",
   opts:["stop","drop","end","fall"],correct:1,
   exp:"The idiom is <strong>let it drop</strong> (= stop discussing it).",ref:"WB p.6 · L2B Ex 2 #6"},

  /* SECTION E */
  {sec:"E",num:1,q:"\"Then the boss asked me to say who I thought was to blame. It was so embarrassing!\" — Which idiom fits?",
   opts:["put somebody on the spot","fire questions at someone","jump down somebody's throat","insist on having the last word"],
   correct:0,exp:"The boss <strong>put me on the spot</strong> by forcing a difficult answer.",ref:"WB p.6 · L2B Ex 3 a"},
  {sec:"E",num:2,q:"\"You always have to be the last one to speak, don't you?\" — Which idiom fits?",
   opts:["fire questions at someone","insist on having the last word","not get a word in edgeways","refuse to let it drop"],
   correct:1,exp:"The speaker is criticising someone who <strong>insists on having the last word</strong>.",ref:"WB p.6 · L2B Ex 3 b"},
  {sec:"E",num:3,q:"\"I told him I didn't want to talk about it anymore, but he wouldn't stop.\" — Which idiom fits?",
   opts:["jump down somebody's throat","fire questions at someone","refuse to let it drop","put somebody on the spot"],
   correct:2,exp:"He <strong>refused to let it drop</strong> — wouldn't stop the conversation.",ref:"WB p.6 · L2B Ex 3 c"},
  {sec:"E",num:4,q:"\"He just kept asking me one thing after another for what seemed like ages.\" — Which idiom fits?",
   opts:["fire questions at someone","not get a word in edgeways","insist on having the last word","jump down somebody's throat"],
   correct:0,exp:"He was <strong>firing questions at me</strong> — many quick questions.",ref:"WB p.6 · L2B Ex 3 d"},
  {sec:"E",num:5,q:"\"When I told her I was going to be a few minutes late, she got really angry!\" — Which idiom fits?",
   opts:["put somebody on the spot","refuse to let it drop","jump down somebody's throat","fire questions at someone"],
   correct:2,exp:"She <strong>jumped down my throat</strong> — reacted angrily.",ref:"WB p.6 · L2B Ex 3 e"},
  {sec:"E",num:6,q:"\"She talked so much that I didn't manage to say anything at all during lunch.\" — Which idiom fits?",
   opts:["fire questions at someone","not get a word in edgeways","insist on having the last word","refuse to let it drop"],
   correct:1,exp:"I couldn't <strong>get a word in edgeways</strong> — she dominated the talk.",ref:"WB p.6 · L2B Ex 3 f"},

  /* SECTION F */
  {sec:"F",num:1,q:"Amina: \"So how did your evening go, Huda? Did you and Maha _____ it off?\"",
   opts:["take","hit","strike","make"],correct:1,
   exp:"<strong>hit it off</strong> = like each other immediately.",ref:"WB p.6 · L2B Ex 4 gap 1"},
  {sec:"F",num:2,q:"Huda: \"I tried to _____ up a conversation by paying her a compliment...\"",
   opts:["hit","make","strike","take"],correct:2,
   exp:"<strong>strike up a conversation</strong> = start a conversation.",ref:"WB p.6 · L2B Ex 4 gap 2"},
  {sec:"F",num:3,q:"\"...by paying her a _____, but I have a feeling that I came across as a bit over-enthusiastic.\"",
   opts:["compliment","bond","impression","laugh"],correct:0,
   exp:"<strong>pay (somebody) a compliment</strong> = say something nice about them.",ref:"WB p.6 · L2B Ex 4 gap 3"},
  {sec:"F",num:4,q:"\"I have a feeling that I came _____ as a bit over-enthusiastic.\"",
   opts:["across","over","along","through"],correct:0,
   exp:"<strong>come across as</strong> = give a particular impression.",ref:"WB p.6 · L2B Ex 4 gap 4"},
  {sec:"F",num:5,q:"Amina: \"Oh, I wouldn't worry. I'm sure you made a favourable _____.\"",
   opts:["bond","laugh","impression","compliment"],correct:2,
   exp:"<strong>make a favourable impression</strong> = give a good first impression.",ref:"WB p.6 · L2B Ex 4 gap 5"},
  {sec:"F",num:6,q:"\"People usually _____ to you, right?\"",
   opts:["hit","take","strike","make"],correct:1,
   exp:"<strong>take to someone</strong> = like them quickly.",ref:"WB p.6 · L2B Ex 4 gap 6"},
  {sec:"F",num:7,q:"Huda: \"I mean … we made quite a lot of _____ talk...\"",
   opts:["bond","laugh","small","compliment"],correct:2,
   exp:"<strong>small talk</strong> = polite light conversation.",ref:"WB p.6 · L2B Ex 4 gap 7"},
  {sec:"F",num:8,q:"\"...but we also had a _____. She's got a good sense of humour.\"",
   opts:["laugh","bond","compliment","impression"],correct:0,
   exp:"<strong>have a laugh</strong> = enjoy something funny together.",ref:"WB p.6 · L2B Ex 4 gap 8"},
  {sec:"F",num:9,q:"Amina: \"You can't expect to create a strong _____ after just one evening out.\"",
   opts:["impression","laugh","compliment","bond"],correct:3,
   exp:"<strong>create a bond</strong> = form a strong connection.",ref:"WB p.6 · L2B Ex 4 gap 9"},

  /* SECTION G — NEW — SB p.10 L5A Ex 2 — match strong adjective to synonym */
  {sec:"G",num:1,q:"Which word is the basic synonym of <strong>terrified</strong>?",
   opts:["frightened","furious","surprised","nervous"],correct:0,
   exp:"<strong>terrified</strong> is the STRONGER form of <strong>frightened</strong> (extremely afraid).",ref:"SB p.10 · L5A Ex 2 #1"},
  {sec:"G",num:2,q:"Which word is the basic synonym of <strong>astonished</strong>?",
   opts:["confused","surprised","thrilled","annoyed"],correct:1,
   exp:"<strong>astonished</strong> is the STRONGER form of <strong>surprised</strong>.",ref:"SB p.10 · L5A Ex 2 #2"},
  {sec:"G",num:3,q:"Which word is the basic synonym of <strong>exasperated</strong>?",
   opts:["sad","nervous","annoyed","confused"],correct:2,
   exp:"<strong>exasperated</strong> is the STRONGER form of <strong>annoyed</strong> (very frustrated).",ref:"SB p.10 · L5A Ex 2 #3"},
  {sec:"G",num:4,q:"Which word is the basic synonym of <strong>livid</strong>?",
   opts:["thrilled","furious","surprised","sad"],correct:1,
   exp:"<strong>livid</strong> is the STRONGER form of <strong>furious</strong> (extremely angry).",ref:"SB p.10 · L5A Ex 2 #4"},
  {sec:"G",num:5,q:"Which word is the basic synonym of <strong>tense</strong>?",
   opts:["nervous","annoyed","confused","sad"],correct:0,
   exp:"<strong>tense</strong> is the STRONGER form of <strong>nervous</strong> (anxious / on edge).",ref:"SB p.10 · L5A Ex 2 #5"},
  {sec:"G",num:6,q:"Which word is the basic synonym of <strong>ecstatic</strong>?",
   opts:["surprised","thrilled","frightened","furious"],correct:1,
   exp:"<strong>ecstatic</strong> is the STRONGER form of <strong>thrilled</strong> (extremely happy).",ref:"SB p.10 · L5A Ex 2 #6"},
  {sec:"G",num:7,q:"Which word is the basic synonym of <strong>bewildered</strong>?",
   opts:["confused","nervous","annoyed","sad"],correct:0,
   exp:"<strong>bewildered</strong> is the STRONGER form of <strong>confused</strong> (totally puzzled).",ref:"SB p.10 · L5A Ex 2 #7"},
  {sec:"G",num:8,q:"Which word is the basic synonym of <strong>devastated</strong>?",
   opts:["nervous","furious","sad","surprised"],correct:2,
   exp:"<strong>devastated</strong> is the STRONGER form of <strong>sad</strong> (extremely upset).",ref:"SB p.10 · L5A Ex 2 #8"},

  /* SECTION H — NEW — SB p.10 L5A Ex 3 — complete sentences with strong adjectives */
  {sec:"H",num:1,q:"I'm completely _____ about my exam results – I never thought I'd do so well!",
   opts:["bewildered","ecstatic","livid","tense"],correct:1,
   exp:"<strong>ecstatic</strong> = extremely happy/thrilled (about great exam results).",ref:"SB p.10 · L5A Ex 3 #1"},
  {sec:"H",num:2,q:"He has no idea how he lost his phone. He feels completely _____.",
   opts:["devastated","exasperated","bewildered","astonished"],correct:2,
   exp:"<strong>bewildered</strong> = totally confused (no idea what happened).",ref:"SB p.10 · L5A Ex 3 #2"},
  {sec:"H",num:3,q:"Randa's mother was absolutely _____ when she found out that her daughter had cheated in the exam again.",
   opts:["livid","tense","ecstatic","astonished"],correct:0,
   exp:"<strong>livid</strong> = extremely angry (at repeated cheating).",ref:"SB p.10 · L5A Ex 3 #3"},
  {sec:"H",num:4,q:"She felt very _____ as she waited for her job interview.",
   opts:["devastated","tense","livid","ecstatic"],correct:1,
   exp:"<strong>tense</strong> = very nervous (before an interview).",ref:"SB p.10 · L5A Ex 3 #4"},
  {sec:"H",num:5,q:"He's _____ that someone will find out his secret.",
   opts:["terrified","ecstatic","exasperated","astonished"],correct:0,
   exp:"<strong>terrified</strong> = extremely afraid (his secret will be exposed).",ref:"SB p.10 · L5A Ex 3 #5"},
  {sec:"H",num:6,q:"Nothing is changing and he is becoming more and more _____ about the situation.",
   opts:["ecstatic","terrified","exasperated","bewildered"],correct:2,
   exp:"<strong>exasperated</strong> = extremely annoyed/frustrated (nothing changes).",ref:"SB p.10 · L5A Ex 3 #6"},
];

let state = {mode:null,questions:[],idx:0,answers:[],startTime:0,selected:null,confidence:null,locked:false,section:null};

const STORAGE_KEY = "tawjihi_u1_exact_v2";
function loadStore(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return{}}}
function saveStore(s){localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}
function getMistakeBank(){return loadStore().mistakes||[]}
function setMistakeBank(b){const s=loadStore();s.mistakes=b;saveStore(s)}

function goHome(){
  if(state.mode && state.mode!=='study' && state.answers.length>0 &&
     !confirm("Return to home? Your current progress will be lost.")) return;
  renderHome();
}

function renderHome(){
  state = {mode:null,questions:[],idx:0,answers:[],startTime:0,selected:null,confidence:null,locked:false,section:null};
  const store = loadStore();
  const bank = getMistakeBank();
  const bestMastery = store.bestMastery || 0;
  const attempts = store.attempts || 0;
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>📘 Unit 1 — "Get the message" (v2 — Updated)</h2>
      <p class="intro">
        This trainer uses the <strong>exact questions</strong> from your Jordan High Note Grade 11 books —
        Lessons 2A, 3A, and <strong>5A</strong> (Student's Book) plus Lesson 2B (Workbook) —
        covering <strong>${QUESTIONS.length} vocabulary items across 8 sections</strong>.
        <br><br>
        <strong>⭐ NEW in v2:</strong> Sections G & H now include the emotion-adjective exercises from
        <strong>Lesson 5A page 10 (Ex 2 and Ex 3)</strong> that were missing in v1.
      </p>
      <div class="results-grid">
        <div class="stat"><div class="value">${attempts}</div><div class="label">Attempts</div></div>
        <div class="stat good"><div class="value">${bestMastery}%</div><div class="label">Best Mastery</div></div>
        <div class="stat warn"><div class="value">${bank.length}</div><div class="label">Mistake Bank</div></div>
        <div class="stat"><div class="value">${QUESTIONS.length}</div><div class="label">Total Questions</div></div>
      </div>
      <div class="mode-grid">
        <button class="mode-btn" onclick="renderStudy()">
          <span class="icon">📖</span>
          <span class="title">Study Mode</span>
          <span class="desc">See all ${QUESTIONS.length} questions WITH the correct answers and explanations upfront. Printable answer key.</span>
        </button>
        <button class="mode-btn" onclick="startMode('practice')">
          <span class="icon">🎓</span>
          <span class="title">Practice (with feedback)</span>
          <span class="desc">All ${QUESTIONS.length} questions in MCQ format with instant feedback after each.</span>
        </button>
        <button class="mode-btn" onclick="startMode('test')">
          <span class="icon">📝</span>
          <span class="title">Full Unit Test</span>
          <span class="desc">All ${QUESTIONS.length} questions. No feedback until the end. Simulates exam conditions.</span>
        </button>
        <button class="mode-btn" onclick="renderSectionPicker()">
          <span class="icon">🎯</span>
          <span class="title">Section Test</span>
          <span class="desc">Focus on one of the 8 book exercises (A–H).</span>
        </button>
        <button class="mode-btn" onclick="startMode('mistakes')" ${bank.length===0?'disabled':''}>
          <span class="icon">⚠️</span>
          <span class="title">Mistake Bank Review</span>
          <span class="desc">${bank.length===0?'Empty — complete a test first.':bank.length+' question(s) to review.'}</span>
        </button>
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

function renderSectionPicker(){
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>🎯 Choose a Section</h2>
      <div class="section-pick">
        ${Object.entries(SECTIONS).map(([k,s])=>{
          const count = QUESTIONS.filter(q=>q.sec===k).length;
          return `<button class="mode-btn" onclick="startMode('section','${k}')">
            <span class="badge ${k}">${k} · ${count} Q</span>
            <span class="title">${s.title}</span>
            <span class="desc">${s.source}<br>${s.instruction}</span>
          </button>`;
        }).join("")}
      </div>
      <button class="btn secondary" onclick="renderHome()">← Back to Home</button>
    </div>
  `;
  window.scrollTo(0,0);
}

function renderStudy(){
  state.mode = 'study';
  let html = `
    <div class="card">
      <h2>📖 Study Mode — Answer Key</h2>
      <p class="intro">All ${QUESTIONS.length} questions from Unit 1 with the correct answer highlighted in green.
      Read through, then practise.</p>
      <div class="btn-row">
        <button class="btn" id="print-btn" onclick="window.print()">🖨️ Print Answer Key</button>
        <button class="btn secondary" onclick="renderHome()">← Back to Home</button>
      </div>
    </div>
  `;
  Object.entries(SECTIONS).forEach(([secKey,sec])=>{
    const qs = QUESTIONS.filter(q=>q.sec===secKey);
    html += `
      <div class="study-section">
        <div class="study-header ${secKey}">
          <div>
            <h3>${sec.title}</h3>
            <div class="src">${sec.source} · ${sec.instruction}</div>
          </div>
          <span class="badge ${secKey}">${qs.length} Q</span>
        </div>
        ${qs.map((q,i)=>`
          <div class="study-q">
            <div class="qnum">Question ${i+1} · ${q.ref}</div>
            <div class="qtext">${q.q}</div>
            ${q.opts.map((opt,j)=>`
              <div class="study-opt ${j===q.correct?'correct':''}">
                <span class="letter-sm">${String.fromCharCode(65+j)}</span>
                <span>${opt}${j===q.correct?' ✅':''}</span>
              </div>
            `).join("")}
            <div class="study-exp">💡 ${q.exp}</div>
          </div>
        `).join("")}
      </div>
    `;
  });
  document.getElementById("app").innerHTML = html;
  window.scrollTo(0,0);
}

function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}

function startMode(mode, section=null){
  state.mode = mode;
  state.idx = 0; state.answers = []; state.startTime = Date.now();
  state.selected = null; state.confidence = null; state.locked = false;
  state.section = section;
  if(mode==='practice' || mode==='test'){
    state.questions = [...QUESTIONS];
  } else if(mode==='section'){
    state.questions = QUESTIONS.filter(q=>q.sec===section);
  } else if(mode==='mistakes'){
    const bank = getMistakeBank();
    const refs = bank.map(m=>m.qRef);
    state.questions = shuffle(refs.map(r=>QUESTIONS.find(q=>q.ref===r)).filter(Boolean));
  }
  renderQuestion();
}

function renderQuestion(){
  if(state.idx >= state.questions.length){renderResults(); return;}
  const q = state.questions[state.idx];
  const total = state.questions.length;
  const progress = ((state.idx)/total)*100;
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="badge ${q.sec}">Section ${q.sec} · #${q.num}</span>
        <span style="color:var(--muted);font-size:13px">Question ${state.idx+1} of ${total}</span>
      </div>
      <div class="question-text">${q.q}</div>
      <div class="options" id="options">
        ${q.opts.map((o,i)=>`
          <button class="option" onclick="selectOption(${i})" id="opt-${i}">
            <span class="letter">${String.fromCharCode(65+i)}</span>
            <span>${o}</span>
          </button>
        `).join("")}
      </div>
      <div class="confidence">
        <div class="confidence-label">How sure are you?</div>
        <div class="confidence-options">
          <div class="conf-opt" onclick="selectConf('sure',this)">✅ Sure</div>
          <div class="conf-opt" onclick="selectConf('guess',this)">🤔 Guess</div>
          <div class="conf-opt" onclick="selectConf('dontknow',this)">❓ Don't know</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="submitBtn" onclick="submitAnswer()" disabled>Submit</button>
      </div>
      <div id="feedback"></div>
    </div>
  `;
  window.scrollTo(0,0);
}

function selectOption(i){
  if(state.locked) return;
  state.selected = i;
  document.querySelectorAll(".option").forEach((el,idx)=>{
    el.classList.toggle("selected", idx===i);
  });
  updateSubmit();
}
function selectConf(c, el){
  if(state.locked) return;
  state.confidence = c;
  document.querySelectorAll(".conf-opt").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
  updateSubmit();
}
function updateSubmit(){
  const btn = document.getElementById("submitBtn");
  if(btn) btn.disabled = !(state.selected!==null && state.confidence!==null);
}

function submitAnswer(){
  if(state.selected===null || state.confidence===null) return;
  const q = state.questions[state.idx];
  const correct = state.selected === q.correct;
  state.locked = true;
  state.answers.push({qRef:q.ref, selected:state.selected, confidence:state.confidence, correct});
  updateMistakeBank(q.ref, state.selected, state.confidence, correct);
  if(state.mode==='practice' || state.mode==='mistakes' || state.mode==='section'){
    document.querySelectorAll(".option").forEach((el,idx)=>{
      el.classList.add("locked");
      if(idx===q.correct) el.classList.add("correct");
      else if(idx===state.selected) el.classList.add("wrong");
    });
    const fb = document.getElementById("feedback");
    fb.innerHTML = `
      <div class="explanation">
        <div><strong>${correct?'✅ Correct!':'❌ Not quite.'}</strong> The answer is <strong>${String.fromCharCode(65+q.correct)}. ${q.opts[q.correct]}</strong>.</div>
        <div style="margin-top:6px">${q.exp}</div>
        <span class="ref">📖 ${q.ref}</span>
      </div>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn" onclick="nextQuestion()">${state.idx+1===state.questions.length?'Finish →':'Next →'}</button>
      </div>
    `;
    document.getElementById("submitBtn").style.display="none";
  } else {
    nextQuestion();
  }
}

function nextQuestion(){
  state.idx++;
  state.selected = null; state.confidence = null; state.locked = false;
  if(state.idx >= state.questions.length) renderResults();
  else renderQuestion();
}

function updateMistakeBank(qRef, selected, conf, correct){
  let bank = getMistakeBank();
  const existing = bank.find(m=>m.qRef===qRef);
  if(correct && conf==='sure'){
    if(existing) bank = bank.filter(m=>m.qRef!==qRef);
    setMistakeBank(bank); return;
  }
  let reason = null;
  if(!correct && conf==='sure') reason='danger';
  else if(!correct) reason='wrong';
  else if(correct && conf==='guess') reason='guess';
  else if(correct && conf==='dontknow') reason='dontknow';
  if(reason){
    if(existing){
      existing.reason = reason;
      existing.repeats = (existing.repeats||1)+1;
      existing.lastSelected = selected;
    } else {
      bank.push({qRef, reason, repeats:1, lastSelected:selected});
    }
    setMistakeBank(bank);
  }
}

function renderResults(){
  const ans = state.answers;
  const total = ans.length;
  const correct = ans.filter(a=>a.correct).length;
  const guessed = ans.filter(a=>a.confidence==='guess').length;
  const dontknow = ans.filter(a=>a.confidence==='dontknow').length;
  const wrongSure = ans.filter(a=>!a.correct && a.confidence==='sure').length;

  let mastery = 0;
  ans.forEach(a=>{
    if(a.correct){
      if(a.confidence==='sure') mastery+=1;
      else if(a.confidence==='guess') mastery+=0.5;
      else mastery+=0.25;
    }
  });
  const masteryPct = Math.round((mastery/total)*100);
  const scorePct = Math.round((correct/total)*100);

  const secStats = {};
  ans.forEach(a=>{
    const q = QUESTIONS.find(x=>x.ref===a.qRef);
    if(!q) return;
    if(!secStats[q.sec]) secStats[q.sec]={right:0,total:0};
    secStats[q.sec].total++;
    if(a.correct) secStats[q.sec].right++;
  });
  let weakSec = null, weakRate = 1.1;
  Object.entries(secStats).forEach(([s,v])=>{
    const r = v.right/v.total;
    if(r<weakRate){weakRate=r; weakSec=s;}
  });

  let readiness, rClass, recommend;
  if(scorePct<=50){readiness="Not Ready — needs serious review"; rClass="r1";
    recommend="Re-read Lessons 2A, 3A & 5A and use Study Mode before retaking.";}
  else if(scorePct<=70){readiness="Needs Review"; rClass="r2";
    recommend="Focus on Section <strong>"+(weakSec||"")+"</strong> using Section Test mode.";}
  else if(scorePct<=85){readiness="Good — Close to Mastery"; rClass="r3";
    recommend="Clear your Mistake Bank and retake the Full Test.";}
  else if(scorePct<=94){readiness="Ready for Unit Test"; rClass="r4";
    recommend="Strong performance. One more round to push mastery higher.";}
  else if(wrongSure>0){readiness="Ready for Unit Test"; rClass="r4";
    recommend="Excellent score, but you have "+wrongSure+" wrong-with-confidence answer(s). Review those carefully.";}
  else {readiness="🌟 Ready for Full Mark!"; rClass="r5";
    recommend="Perfect mastery on Unit 1 vocabulary. Ready to move to Unit 2!";}

  const sec = Math.floor((Date.now()-state.startTime)/1000);
  const timeStr = Math.floor(sec/60)+":"+String(sec%60).padStart(2,'0');

  const store = loadStore();
  store.attempts = (store.attempts||0)+1;
  store.lastScore = scorePct;
  store.bestMastery = Math.max(store.bestMastery||0, masteryPct);
  saveStore(store);

  const secNames = {A:"A · Phrasal Verbs (sentences)",B:"B · Phrasal Verbs (definitions)",
                    C:"C · Idiom Meanings",D:"D · Complete the Idiom",
                    E:"E · Match Situations",F:"F · Conversation Gaps",
                    G:"G · Strong Adjectives ↔ Synonyms",H:"H · Sentences with Emotion Adjectives"};

  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>📊 Results</h2>
      <div class="readiness ${rClass}">${readiness}</div>
      <div class="results-grid">
        <div class="stat ${scorePct>=80?'good':scorePct>=60?'warn':'bad'}">
          <div class="value">${correct}/${total}</div><div class="label">Score (${scorePct}%)</div>
        </div>
        <div class="stat good"><div class="value">${masteryPct}%</div><div class="label">Mastery</div></div>
        <div class="stat warn"><div class="value">${guessed}</div><div class="label">Guesses</div></div>
        <div class="stat"><div class="value">${dontknow}</div><div class="label">Don't Know</div></div>
        <div class="stat danger"><div class="value">${wrongSure}</div><div class="label">⚠️ Wrong + Sure</div></div>
        <div class="stat"><div class="value">${timeStr}</div><div class="label">Time</div></div>
      </div>
      <div class="explanation"><strong>💡 Recommendation:</strong> ${recommend}</div>
      ${weakSec && weakRate<1 ? `<p style="margin-top:12px"><strong>Weakest section:</strong> ${secNames[weakSec]} (${Math.round(weakRate*100)}% correct)</p>`:''}
      <div class="btn-row" style="margin-top:18px">
        <button class="btn" onclick="reviewWrong()">📖 Review Wrong Answers</button>
        <button class="btn secondary" onclick="startMode('${state.mode}'${state.section?",'"+state.section+"'":""})">🔄 Retake</button>
        <button class="btn secondary" onclick="renderHome()">🏠 Home</button>
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

function reviewWrong(){
  const wrongAns = state.answers.filter(a=>!a.correct);
  if(wrongAns.length===0){
    document.getElementById("app").innerHTML = `
      <div class="card">
        <h2>🎉 No wrong answers to review!</h2>
        <p>You got everything correct. Great work!</p>
        <button class="btn" onclick="renderHome()">🏠 Back to Home</button>
      </div>`;
    return;
  }
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>📖 Review Wrong Answers (${wrongAns.length})</h2>
      ${wrongAns.map(a=>{
        const q = QUESTIONS.find(x=>x.ref===a.qRef);
        if(!q) return '';
        return `<div class="mistake-item">
          <span class="badge ${q.sec}">Section ${q.sec}</span>
          <div class="question-text" style="font-size:15px">${q.q}</div>
          <div>❌ Your answer: <strong>${q.opts[a.selected]}</strong></div>
          <div>✅ Correct: <strong>${q.opts[q.correct]}</strong></div>
          <div class="explanation" style="margin-top:10px">${q.exp}<span class="ref">📖 ${q.ref}</span></div>
        </div>`;
      }).join("")}
      <button class="btn" onclick="renderHome()">🏠 Back to Home</button>
    </div>
  `;
  window.scrollTo(0,0);
}

renderHome();
</script>
